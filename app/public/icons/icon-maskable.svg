<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: full-bleed background, and the mark scaled to 80 % so it
       stays well inside the central safe-zone circle (radius 204.8). -->
  <rect width="512" height="512" fill="#2553c9"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <polyline points="128,160 192,352 256,208 320,352 384,160" fill="none"
      stroke="#ffffff" stroke-width="48" stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>
</svg>
