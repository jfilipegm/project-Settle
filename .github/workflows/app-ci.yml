# The web app's checks (app/). Separate from workflow-conformance.yml, which
# covers the workflow tooling at the repository root.
name: App CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, every branch and tag: the test that no real
          # receipt is in any commit (R17) refuses to pass on a shallow
          # clone, since it would miss one committed and then deleted.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The PaddleOCR models (M2.5 plan, P5), downloaded by
      # scripts/vendor-paddle.mjs, which pins their revision and SHA-256s:
      # the key follows that file, so a changed pin downloads afresh and a
      # restored file is still checked against its hash.
      - uses: actions/cache@v4
        with:
          path: app/.paddle-models
          key: paddle-models-${{ hashFiles('app/scripts/vendor-paddle.mjs') }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The build, with one ONNX Runtime wasm under vendor/ort/ (M2.5, P4)
      # and no Tesseract file (P10).
      - run: npm run build
      - run: node scripts/check-build.mjs
      # The browser smoke test (M2.5, CP4): the runner's Chrome scans two
      # committed samples through the real app (the worker, the wasm and
      # model paths, Vite's bundling, the browser's pixels, the CSP), and
      # each imported bill must match its sample by P2, with no request
      # carrying a receipt value. Ubuntu 24.04 restricts the unprivileged
      # user namespaces Chrome's sandbox needs; this lifts that for the job.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test, sample 1 (a JPEG photo with a fiscal QR code)
        run: >-
          node scripts/check-requests.mjs scan
          --file src/features/receipt/fixtures/browser/sample-1.jpg
          --values src/features/receipt/fixtures/browser/sample-1.expected.json
          --expect-bill src/features/receipt/fixtures/browser/sample-1.expected.json
          --brave "$(command -v google-chrome)"
      - name: Smoke test, sample 12 (a supermarket photo)
        run: >-
          node scripts/check-requests.mjs scan
          --file src/features/receipt/fixtures/browser/sample-12.jpg
          --values src/features/receipt/fixtures/browser/sample-12.expected.json
          --expect-bill src/features/receipt/fixtures/browser/sample-12.expected.json
          --brave "$(command -v google-chrome)"
      # The smoke test can fail: with a wrong expected bill (one price
      # changed), the same scan must fail on the bill, and on nothing else.
      - name: Smoke test, a wrong expected bill fails
        run: |
          node -e "
            const fs = require('node:fs')
            const file = 'src/features/receipt/fixtures/browser/sample-1.expected.json'
            const expected = JSON.parse(fs.readFileSync(file, 'utf8'))
            expected.items[0].lineTotal = '3.10'
            fs.writeFileSync('/tmp/sample-1.wrong.json', JSON.stringify(expected))
          "
          if node scripts/check-requests.mjs scan \
            --file src/features/receipt/fixtures/browser/sample-1.jpg \
            --values src/features/receipt/fixtures/browser/sample-1.expected.json \
            --expect-bill /tmp/sample-1.wrong.json \
            --out /tmp/wrong.json --brave "$(command -v google-chrome)"; then
            echo 'A wrong expected bill passed'; exit 1
          fi
          node -e "
            const report = JSON.parse(require('node:fs').readFileSync('/tmp/wrong.json', 'utf8'))
            const onlyTheBill = report.expectBill?.noEditNeeded === false &&
              report.failures.length === 0 && report.proxyFailures.length === 0 &&
              report.cspViolations.length === 0
            if (!onlyTheBill) { console.error(JSON.stringify(report.expectBill)); process.exit(1) }
          "
