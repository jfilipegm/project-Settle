# Every PR must say what it adds, as a Conventional Commit title such as
# "feat(m1): bill splitter" or "fix: rounding in allocate". The release
# workflow reads these titles to choose the version bump.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          # Through env, never interpolated into the script: titles are
          # user input.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([A-Za-z0-9._/-]+\))?!?: [^ ].*'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must look like 'type(scope)?: description', where type is feat, fix, perf, refactor, docs, test, build, ci, chore, style or revert (add ! for a breaking change). Got: $TITLE"
            exit 1
          fi
