# Publishes a GitHub Release for every push to master: the next semantic
# version tag, auto-generated notes (the PRs merged since the previous tag)
# and the built site as a zip. The bump comes from those PRs' Conventional
# Commit titles (enforced by pr-title.yml): a breaking change ("!") bumps
# major, feat bumps minor, anything else bumps patch. master only receives
# commits through PRs that passed the required checks; the release re-runs
# them anyway before publishing.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

# One release at a time, in push order, so two quick merges can't both
# compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to find the previous version
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Pick the next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*.*.*')" ]; then
            echo "HEAD is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          range=${last:+$last..}HEAD

          # PRs merged since the last release, from master's merge commits.
          bump=patch
          for pr in $(git log --first-parent --merges --format=%s "$range" \
                      | sed -n 's/^Merge pull request #\([0-9]*\).*/\1/p'); do
            title=$(gh pr view "$pr" --json title --jq .title)
            echo "#$pr: $title"
            if [[ "$title" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
              bump=major
            elif [[ "$title" =~ ^feat(\([^\)]*\))?: && "$bump" != major ]]; then
              bump=minor
            fi
          done

          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case $bump in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            *)     next="v$major.$minor.$((patch + 1))" ;;
          esac
          echo "Previous: ${last:-none}, bump: $bump, next: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          (cd dist && zip -qr "../settle-$TAG.zip" .)
          gh release create "$TAG" "settle-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
