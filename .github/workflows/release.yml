# Publishes a GitHub Release for every push to master: the next v0.0.N tag,
# auto-generated notes (the PRs merged since the previous tag) and the built
# site as a zip. master only receives commits through PRs that passed the
# required checks; the release re-runs them anyway before publishing.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

# One release at a time, in push order, so two quick merges can't both
# compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to find the previous version
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Pick the next version
        id: version
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v0.0.*')" ]; then
            echo "HEAD is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v0.0.*' --sort=-v:refname | head -n 1)
          n=${last##*.}
          next="v0.0.$(( ${n:-0} + 1 ))"
          echo "Previous: ${last:-none}, next: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          (cd dist && zip -qr "../project-W-$TAG.zip" .)
          gh release create "$TAG" "project-W-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
